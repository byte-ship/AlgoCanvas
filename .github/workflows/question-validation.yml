name: Question Bank Validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  question-validation:
    name: Question validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate templates and smoke-test every READY question
        run: npm test
